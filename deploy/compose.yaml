# The server behind the gateway. Configuration: server.env and the files in certs/. Redis for the one-time jti is the
# platform's (MCP_REDIS_* in server.env); it is not started here. See README.md.
#
# Built after ./mvnw verify with "docker compose build", or pulled from the registry. The "stub" profile adds the stub backend
# of mcp-stub-backend/ for a test stack without a real system; it is never for a production host.
#
# Closed network: MCP_REGISTRY in a .env file next to this one points the image to your registry.

services:
  mcp-example:
    image: ${MCP_REGISTRY:-ghcr.io/aiwcorpo}/mcp-server-example:${MCP_EXAMPLE_VERSION:-2.0.0}
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: server.env
    environment:
      MCP_TLS_KEYSTORE: /certs/keystore.p12
      MCP_TLS_TRUSTSTORE: /certs/truststore.p12
    # cedar-java unpacks its native library at start.
    tmpfs: ["/tmp:exec"]
    mem_limit: ${MCP_EXAMPLE_MEM_LIMIT:-1g}
    volumes:
      - ./certs:/certs:ro
    # mTLS: the gateway connects here, with the certificate of the internal CA. The alias is the name the gateway
    # checks (SAN of the server certificate); on another host publish the port and let DNS name it.
    ports:
      - ${MCP_EXAMPLE_BIND:-0.0.0.0}:8443:8443
    networks:
      default:
        aliases: [mcp-example.internal]
    healthcheck:
      # An open port is the signal: /actuator/health asks for a client certificate like every other path.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  stub-backend:
    profiles: [stub]
    image: eclipse-temurin:25-jre@sha256:78f1f183913482ef390c2722f46c3f0ce76ada341d69590e7c482ec943ee72d5
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Reachable from the server only: nothing is published, and it accepts any credential.
    command: ["java", "-jar", "/app/stub-backend.jar", "--bind", "0.0.0.0", "--port", "18081"]
    volumes:
      - ../mcp-stub-backend/target/mcp-stub-backend.jar:/app/stub-backend.jar:ro
