# Thin wrapper: all logic is in ci/run.sh.
# A pull request runs unreviewed code: its job holds no secret and mounts no Docker socket. GitHub Packages wants a login
# also to read, so the job gets the GITHUB_TOKEN of the run with packages: read only (a token of a pull request from a fork
# has no such right, those builds need the packages to be readable by the repository); MCP_MAVEN_REPOSITORY_URL is a
# repository variable. The main branch gets the registry
# credentials (secrets MCP_MAVEN_REPOSITORY_USER and MCP_MAVEN_REPOSITORY_PASSWORD, kept in the environment ci-main so that
# a pull request cannot read them) and builds the image on the runner. Every action is pinned to a full commit SHA and the build image to its digest.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: maven:3.9.12-eclipse-temurin-25@sha256:4f82a03a7d6679281952d628131299b1be88d7030a49c6a2b7d2ba2642e44e3e
    env:
      MCP_MAVEN_REPOSITORY_URL: ${{ vars.MCP_MAVEN_REPOSITORY_URL }}
      MCP_MAVEN_REPOSITORY_USER: ${{ github.actor }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/run.sh verify
      - name: generator (template only)
        if: hashFiles('tests/new-server-test.sh') != ''
        run: apt-get update -qq && apt-get install -y -qq python3 unzip perl && ci/run.sh generator
  verify-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ci-main
    permissions:
      contents: read
    container:
      image: maven:3.9.12-eclipse-temurin-25@sha256:4f82a03a7d6679281952d628131299b1be88d7030a49c6a2b7d2ba2642e44e3e
    env:
      MCP_MAVEN_REPOSITORY_URL: ${{ vars.MCP_MAVEN_REPOSITORY_URL }}
      MCP_MAVEN_REPOSITORY_USER: ${{ secrets.MCP_MAVEN_REPOSITORY_USER }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MCP_MAVEN_REPOSITORY_PASSWORD }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/run.sh verify
      - name: generator (template only)
        if: hashFiles('tests/new-server-test.sh') != ''
        run: apt-get update -qq && apt-get install -y -qq python3 unzip perl && ci/run.sh generator
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build
          path: |
            mcp-app/target/mcp-*.jar
            mcp-app/target/mcp-manifest.json
  image:
    needs: verify-main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build
          path: mcp-app/target
      - run: ci/run.sh image
