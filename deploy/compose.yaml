# The server behind the gateway. Configuration: server.env and the files in certs/. Redis for the one-time jti is started
# here too (service redis, next to the server). See README.md.
#
# Built after ./mvnw verify with "docker compose build", or pulled from the registry.
#
# Closed network: MCP_REGISTRY in a .env file next to this one points the image to your registry.

services:
  mcp-example:
    image: ${MCP_REGISTRY:-ghcr.io/aiwcorpo}/mcp-server-example:${MCP_EXAMPLE_VERSION:-2.0.0}
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: server.env
    environment:
      MCP_TLS_KEYSTORE: /certs/keystore.p12
      MCP_TLS_TRUSTSTORE: /certs/truststore.p12
      # The Redis started below. Remove it and set this to your own Redis for several instances behind one gateway.
      MCP_REDIS_HOST: redis
    # cedar-java unpacks its native library at start.
    tmpfs: ["/tmp:exec"]
    mem_limit: ${MCP_EXAMPLE_MEM_LIMIT:-1g}
    volumes:
      - ./certs:/certs:ro
    # mTLS: the gateway connects here, with the certificate of the internal CA. The alias is the name the gateway
    # checks (SAN of the server certificate); on another host publish the port and let DNS name it.
    ports:
      - ${MCP_EXAMPLE_BIND:-0.0.0.0}:8443:8443
    networks:
      default:
        aliases: [mcp-example.internal]
      stores: {}
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      # An open port is the signal: /actuator/health asks for a client certificate like every other path.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  # Redis for the one-time jti of the internal JWT, next to the server and reachable from it only. The default user is off; the one
  # account is named like MCP_REDIS_USER and may run SET on its own jti keys. Its password is MCP_REDIS_PASSWORD of the env file
  # (which this service therefore reads too); it goes into an ACL file in /tmp, never into a command line.
  redis:
    image: ${MCP_THIRD_PARTY_REGISTRY:-docker.io/library}/redis:8.8.4-alpine@sha256:be8dfdf58574d626e0abe03073ce9178509e0e9564a316e34e71d2289b8370e1
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    user: redis
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: server.env
    tmpfs: ["/tmp"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 'user default off resetkeys resetchannels -@all\nuser %s on >%s resetkeys ~jti:%s:* resetchannels -@all +set +ping +auth +hello +client|setname +client|setinfo +reset +quit\n' "$$MCP_REDIS_USER" "$$MCP_REDIS_PASSWORD" "$$MCP_REDIS_USER" > /tmp/users.acl
        exec redis-server --aclfile /tmp/users.acl --save "" --appendonly no
    healthcheck:
      # The default user is off, so an answer that asks for a login proves the server is up.
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [stores]

networks:
  stores:
    internal: true
