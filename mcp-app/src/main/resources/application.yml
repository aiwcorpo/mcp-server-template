# Base config (profile-agnostic). Per-environment values go in application-<profile>.yml + env vars.
server:
  port: ${MCP_PORT:8080}
  address: ${MCP_BIND:127.0.0.1}   # bind loopback only; nginx gateway proxies locally
  forward-headers-strategy: framework   # TLS terminated at the nginx gateway; trust X-Forwarded-*

spring:
  application:
    name: mcp-server
  profiles:
    active: ${MCP_PROFILE:local}

  ai:
    mcp:
      server:
        protocol: STREAMABLE          # streamable-http transport
        type: SYNC                    # SYNC or ASYNC
        name: mcp-server              # advertised server name
        version: 0.1.0
        instructions: "MCP server. Tools are least-privilege and audited."
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp/example  # per-system path (rename to /mcp/<system>) so nginx routes by prefix (HTTP; TLS at nginx)
          keep-alive-interval: 30s

# How callers authenticate — one choice for the whole server:
#   oauth  access token from an OIDC provider (Authorization: Bearer); the same token goes to the backend
#   pat    the caller's own backend token (X-PAT-<system>); no identity provider involved
aiwcorpo:
  mcp:
    platform:
      auth-mode: ${MCP_AUTH_MODE:oauth}

# Actuator: expose only health/info/prometheus; secure the rest.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mcp-server
