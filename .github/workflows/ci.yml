# Thin wrapper: all logic is in ci/run.sh.
# A pull request runs unreviewed code: its job holds only contents: read, no token in its environment, no secret and no Docker
# socket. The platform artifacts (mcp-contracts, mcp-platform-starter) come from Maven Central. The main branch builds the
# image on the runner and pushes nothing. Every action is pinned to a full commit SHA and the build image to its digest.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: maven:3.9.12-eclipse-temurin-25@sha256:4f82a03a7d6679281952d628131299b1be88d7030a49c6a2b7d2ba2642e44e3e
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/run.sh verify
      - name: generator (template only)
        if: hashFiles('tests/new-server-test.sh') != ''
        run: apt-get update -qq && apt-get install -y -qq python3 unzip perl && ci/run.sh generator
  verify-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: maven:3.9.12-eclipse-temurin-25@sha256:4f82a03a7d6679281952d628131299b1be88d7030a49c6a2b7d2ba2642e44e3e
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/run.sh verify
      - name: generator (template only)
        if: hashFiles('tests/new-server-test.sh') != ''
        run: apt-get update -qq && apt-get install -y -qq python3 unzip perl && ci/run.sh generator
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build
          path: |
            mcp-app/target/mcp-*.jar
            mcp-app/target/mcp-manifest.json
  image:
    needs: verify-main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build
          path: mcp-app/target
      - run: ci/run.sh image
