# PROD PROFILE — plain HTTP; TLS terminated at the nginx gateway.
# Secrets come from the environment (never committed). Activate with MCP_PROFILE=prod.
# No OAuth: each caller sends their own PAT per request (X-PAT-<system>); the server forwards it
# to the backend and never stores it.

# Backend the outbound adapter calls. Per-user PATs arrive in X-PAT-<system> headers (not stored here).
example:
  backend:
    base-url: ${EXAMPLE_BACKEND_BASE_URL}

# Tool guard policy: who may call which risk level, kill switches, confirmation rules.
# A file on disk, outside the jar, so it can be changed without a redeploy (it is re-read on change).
# Required in prod — the server does not start without it.
aiwcorpo:
  mcp:
    platform:
      guard:
        policy-file: ${MCP_GUARD_POLICY}
        # Identity provider (OIDC), used when MCP_AUTH_MODE=oauth (the default). Set both: without an
        # audience, a token the provider issued for any other application would be accepted here.
        # Leave them unset only when running with MCP_AUTH_MODE=pat.
        oidc:
          issuer-uri: ${MCP_OIDC_ISSUER:}
          audiences: ${MCP_OIDC_AUDIENCE:}
          subject-claim: ${MCP_OIDC_SUBJECT_CLAIM:sub}
