# Merge request pipelines run code nobody has reviewed yet, so they get no secret and no Docker socket.
stages:
  - verify

default:
  image: maven:3.9.12-eclipse-temurin-25@sha256:4f82a03a7d6679281952d628131299b1be88d7030a49c6a2b7d2ba2642e44e3e
  cache:
    key: maven
    paths: [.m2/repository]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

verify:
  stage: verify
  script:
    - ./mvnw -B verify
  artifacts:
    when: always
    paths:
      - mcp-app/target/mcp-*.jar
      - mcp-app/target/mcp-manifest.json
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
