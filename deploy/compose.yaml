# The server of the system "example", on any host. Configuration: server.env, and certs/ only when you bring your own certificate.
# The server is the only service: the one-time jti of the internal JWT is kept in its memory (Redis only for several instances,
# see server.env), and the state volume keeps the self-signed certificate and the cursor key between starts. See README.md.
#
# Built after ./mvnw verify with "docker compose build", or pulled from the registry.
#
# Closed network: MCP_REGISTRY in a .env file next to this one points the image to your registry.

services:
  mcp-example:
    image: ${MCP_REGISTRY:-ghcr.io/aiwcorpo}/mcp-server-example:${MCP_EXAMPLE_VERSION:-2.0.0}
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: server.env
    # cedar-java unpacks its native library at start.
    tmpfs: ["/tmp:exec"]
    mem_limit: ${MCP_EXAMPLE_MEM_LIMIT:-1g}
    volumes:
      # The generated certificate must be the same at every start, or the operator has to approve the connection again.
      - state:/var/lib/mcp/state
      # Only for your own certificate (MCP_TLS_CERT, MCP_TLS_KEY or MCP_TLS_KEYSTORE in server.env); the directory may stay empty.
      - ./certs:/certs:ro
    # The gateway connects here, to the address the operator enters in the portal. The port is the one of that address.
    ports:
      - ${MCP_EXAMPLE_BIND:-0.0.0.0}:8443:8443
    healthcheck:
      # An open port is the signal: the image has no HTTP client, and /actuator/health is the only path without a token.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

volumes:
  state:
